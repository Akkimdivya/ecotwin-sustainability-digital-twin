<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">EcoTwin Checkpoint 2 production architecture</title>
  <desc id="desc">Controlled cloud data flows through BigQuery into a read-only Cloud Run digital twin, waste detector and deterministic simulator. Vertex AI Gemini explains the fixed simulation result, with a deterministic fallback.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061812"/>
      <stop offset="1" stop-color="#0a211a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#78f7bb"/>
      <stop offset="1" stop-color="#27db88"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000" flood-opacity="0.25"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#57e9a4"/>
    </marker>
    <style>
      .title { font: 700 44px Inter, Segoe UI, Arial, sans-serif; fill: #f2fff8; }
      .subtitle { font: 400 20px Inter, Segoe UI, Arial, sans-serif; fill: #9fb8ad; }
      .eyebrow { font: 700 14px Inter, Segoe UI, Arial, sans-serif; letter-spacing: 2px; fill: #69edac; }
      .card-title { font: 700 22px Inter, Segoe UI, Arial, sans-serif; fill: #f2fff8; }
      .body { font: 400 16px Inter, Segoe UI, Arial, sans-serif; fill: #a9c2b7; }
      .small { font: 600 14px Inter, Segoe UI, Arial, sans-serif; fill: #d3e9df; }
      .micro { font: 600 12px Inter, Segoe UI, Arial, sans-serif; fill: #81a296; letter-spacing: 1px; }
      .metric { font: 700 18px Inter, Segoe UI, Arial, sans-serif; fill: #76f4b8; }
      .card { fill: #0d2b21; stroke: #1f4a39; stroke-width: 2; }
      .inner { fill: #0a2119; stroke: #1b4132; stroke-width: 1.5; }
      .arrow { fill: none; stroke: #57e9a4; stroke-width: 3; marker-end: url(#arrow); }
      .arrow-soft { fill: none; stroke: #3f8e6d; stroke-width: 2.5; stroke-dasharray: 8 8; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1390" cy="110" r="240" fill="#32e790" opacity="0.035"/>
  <circle cx="130" cy="810" r="250" fill="#32e790" opacity="0.025"/>

  <g transform="translate(70 58)">
    <rect x="0" y="0" width="54" height="54" rx="15" fill="url(#accent)"/>
    <text x="27" y="37" text-anchor="middle" font-family="Inter, Segoe UI, Arial" font-weight="800" font-size="25" fill="#052016">E</text>
    <text class="title" x="76" y="38">EcoTwin — Checkpoint 2 Architecture</text>
    <text class="subtitle" x="77" y="72">AI-powered sustainability digital twin • simulation only • no production changes</text>
  </g>

  <rect x="70" y="155" width="1460" height="585" rx="28" fill="#081f17" stroke="#285846" stroke-width="2"/>
  <text class="eyebrow" x="100" y="190">GOOGLE CLOUD • PROJECT ECOTWIN-SUSTAINABILITY-2026</text>
  <text class="micro" x="1450" y="190" text-anchor="end">REGION US-CENTRAL1</text>

  <!-- Data plane -->
  <g filter="url(#shadow)">
    <rect class="card" x="105" y="225" width="330" height="420" rx="22"/>
    <text class="eyebrow" x="135" y="265">DATA PLANE</text>
    <text class="card-title" x="135" y="301">Controlled cloud evidence</text>

    <rect class="inner" x="135" y="330" width="270" height="105" rx="16"/>
    <circle cx="170" cy="368" r="18" fill="#163f30" stroke="#62e9aa"/>
    <text x="170" y="374" text-anchor="middle" font-family="Inter, Segoe UI, Arial" font-size="15" font-weight="700" fill="#8bf5c2">JSON</text>
    <text class="small" x="200" y="365">Validated fixtures</text>
    <text class="body" x="200" y="393">9 resources • 32 telemetry rows</text>
    <text class="body" x="200" y="417">7 immutable dependency edges</text>

    <path class="arrow" d="M270 438 L270 470"/>

    <rect class="inner" x="135" y="480" width="270" height="130" rx="16"/>
    <circle cx="170" cy="521" r="18" fill="#163f30" stroke="#62e9aa"/>
    <text x="170" y="527" text-anchor="middle" font-family="Inter, Segoe UI, Arial" font-size="14" font-weight="700" fill="#8bf5c2">BQ</text>
    <text class="small" x="200" y="518">BigQuery ecotwin_demo</text>
    <text class="body" x="200" y="546">7 versioned tables</text>
    <text class="body" x="200" y="572">Live read mode • no fallback</text>
    <text class="micro" x="200" y="596">CONTROLLED_DEMO</text>
  </g>

  <!-- Core -->
  <g filter="url(#shadow)">
    <rect class="card" x="525" y="225" width="555" height="420" rx="22"/>
    <text class="eyebrow" x="555" y="265">CLOUD RUN • ECOTWIN</text>
    <text class="card-title" x="555" y="301">Read-only decision engine</text>
    <rect x="895" y="252" width="150" height="32" rx="16" fill="#123c2d" stroke="#5ceaa9"/>
    <text class="micro" x="970" y="273" text-anchor="middle" fill="#76f4b8">0–2 INSTANCES</text>

    <rect class="inner" x="555" y="330" width="225" height="90" rx="16"/>
    <text class="micro" x="580" y="360">1 • DIGITAL TWIN</text>
    <text class="small" x="580" y="388">Topology + dependencies</text>
    <text class="body" x="580" y="410">Immutable snapshot</text>

    <rect class="inner" x="810" y="330" width="240" height="90" rx="16"/>
    <text class="micro" x="835" y="360">2 • WASTE DETECTION</text>
    <text class="small" x="835" y="388">Idle • over-provisioned</text>
    <text class="body" x="835" y="410">Unattached storage</text>

    <path class="arrow" d="M665 425 L665 460"/>
    <path class="arrow" d="M925 425 L925 460"/>

    <rect x="555" y="470" width="495" height="140" rx="18" fill="#103226" stroke="#5ceaa9" stroke-width="2"/>
    <text class="micro" x="580" y="502">3 • DETERMINISTIC WHAT-IF SIMULATOR</text>
    <text class="card-title" x="580" y="535">Code calculates every number</text>
    <text class="metric" x="580" y="570">Cost • carbon • performance • risk • confidence</text>
    <text class="body" x="580" y="596">Same snapshot + same request = same simulation ID</text>
  </g>

  <!-- Gemini -->
  <g filter="url(#shadow)">
    <rect class="card" x="1170" y="225" width="325" height="270" rx="22"/>
    <text class="eyebrow" x="1200" y="265">VERTEX AI</text>
    <text class="card-title" x="1200" y="301">Gemini 2.5 Flash</text>
    <text class="body" x="1200" y="337">Explains the fixed simulation JSON</text>
    <text class="body" x="1200" y="368">Validation steps + rollback trigger</text>
    <rect x="1200" y="398" width="265" height="60" rx="14" fill="#123c2d" stroke="#5ceaa9"/>
    <text class="small" x="1220" y="424">ADC authentication</text>
    <text class="body" x="1220" y="447">No API key • no key file</text>

    <rect class="card" x="1170" y="520" width="325" height="125" rx="22"/>
    <text class="eyebrow" x="1200" y="556">DEMO RESILIENCE</text>
    <text class="small" x="1200" y="586">Schema validation • retry • cache</text>
    <text class="body" x="1200" y="614">Deterministic fallback if AI fails</text>
  </g>

  <path class="arrow" d="M438 520 C475 520 485 520 520 520"/>
  <path class="arrow" d="M1085 520 C1120 520 1127 350 1165 350"/>
  <path class="arrow-soft" d="M1332 500 L1332 515"/>

  <!-- User flow -->
  <g filter="url(#shadow)">
    <rect x="250" y="785" width="1100" height="75" rx="22" fill="#0e2d22" stroke="#2b6650" stroke-width="2"/>
    <text class="eyebrow" x="280" y="815">PUBLIC CHECKPOINT FLOW</text>
    <text class="small" x="280" y="844">Browser dashboard  →  Digital twin  →  Waste finding  →  Simulate  →  Compare impact  →  Gemini explanation</text>
    <rect x="1135" y="804" width="180" height="36" rx="18" fill="url(#accent)"/>
    <text x="1225" y="827" text-anchor="middle" font-family="Inter, Segoe UI, Arial" font-size="13" font-weight="800" fill="#052016">READ-ONLY API</text>
  </g>
  <path class="arrow" d="M800 650 L800 780"/>

  <text class="micro" x="70" y="885">ENGINE COMPUTES • GEMINI EXPLAINS • ENGINEER DECIDES</text>
  <text class="micro" x="1530" y="885" text-anchor="end">CHECKPOINT 2 • AUGUST 28, 2026</text>
</svg>
